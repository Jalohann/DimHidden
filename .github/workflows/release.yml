# Publishes a release for each new version on main. Releases are built here, from main, never by the agent.
# Merges made by the Review workflow don't trigger push events, so a schedule picks those up.
name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.version.outputs.needed }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - id: version
        run: |
          version=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')
          case "$version" in *[!0-9.]*|"") echo "Bad version: $version" >&2; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}
      - name: Build
        run: |
          SIGN_IDENTITY=- ./build.sh --no-install
          ditto -c -k --keepParent build/DimHidden.app DimHidden.zip
      - name: Write release notes
        run: |
          python3 - <<'PY' > notes.md
          import os, re
          text = open("CHANGELOG.md").read()
          m = re.search(r"^## " + re.escape(os.environ["VERSION"]) + r"\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "See the commit history for changes.")
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$VERSION" DimHidden.zip --target "$SHA" --title "DimHidden $VERSION" --notes-file notes.md
